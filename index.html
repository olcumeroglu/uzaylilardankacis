<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uzaylılardan Kaçış</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { box-sizing:border-box; }
  html,body { margin:0; background:#1a1018; color:#fff; font-family:'Press Start 2P', monospace; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; }
  #wrap { position:relative; width:min(100%, 960px); aspect-ratio:320/192; border:4px solid #000; box-shadow:0 0 0 4px #4a2f45, 8px 8px 0 4px #000; background:#000; overflow:hidden; }
  #c { width:100%; height:100%; display:block; image-rendering:pixelated; }
  #caption { position:absolute; left:4%; right:4%; bottom:2%; background:rgba(20,10,18,0.85); border:3px solid #f3d27a; padding:1.4% 3%; font-size:clamp(7px,1.4vw,13px); line-height:1.7; display:none; }
  #center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  #center h1 { font-size:clamp(16px,4vw,38px); margin:0 0 4%; color:#ffe36b; text-shadow:4px 4px 0 #7a1418, 6px 6px 0 #000; line-height:1.4; }
  #center .sub { font-size:clamp(7px,1.3vw,12px); text-shadow:2px 2px 0 #000; line-height:2; }
  #center .blink { animation:bl 1s steps(2) infinite; margin-top:4%; font-size:clamp(8px,1.5vw,14px); text-shadow:2px 2px 0 #000; }
  #center .gift { margin-top:3%; color:#f19a9a; font-size:clamp(7px,1.2vw,11px); text-shadow:2px 2px 0 #000; }
  #center.dim { background:rgba(10,4,10,0.6); }
  @keyframes bl { 50% { opacity:0; } }
  #hud { position:absolute; top:3%; left:3%; font-size:clamp(7px,1.3vw,12px); text-shadow:2px 2px 0 #000; display:none; line-height:1.8; }
  #skip { position:absolute; top:3%; right:3%; font-family:inherit; font-size:clamp(7px,1.2vw,11px); background:#2a1a24; color:#fff; border:2px solid #fff; padding:6px 8px; cursor:pointer; display:none; }
  #touch { display:flex; gap:12px; margin-top:16px; width:min(100%,960px); justify-content:space-between; }
  #touch div { display:flex; gap:12px; }
  #touch button { font-family:inherit; font-size:18px; width:64px; height:64px; background:#3a2638; color:#fff; border:3px solid #000; box-shadow:4px 4px 0 #000; touch-action:none; user-select:none; -webkit-user-select:none; }
  #touch button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
  .help { font-size:9px; color:#c9a; margin-top:12px; text-align:center; line-height:2; }
  .choices button { pointer-events:auto; font-family:inherit; font-size:clamp(9px,1.8vw,18px); padding:10px 18px; margin:6px 10px; background:#3a2638; color:#fff; border:3px solid #ffe36b; box-shadow:4px 4px 0 #000; cursor:pointer; }
  .choices.jump { margin-top:3%; display:flex; flex-wrap:wrap; justify-content:center; max-width:92%; }
  .choices.jump button { font-size:clamp(6px,1vw,10px); padding:5px 7px; margin:3px; border-width:2px; box-shadow:2px 2px 0 #000; }
  #center.dimlight { background:rgba(10,4,10,0.3); justify-content:flex-start; padding-top:5%; }
  .marquee { width:80%; overflow:hidden; white-space:nowrap; font-size:clamp(9px,1.8vw,17px); color:#f19a9a; text-shadow:2px 2px 0 #000; margin-top:3%; }
  .marquee span { display:inline-block; padding-left:100%; animation:mq 9s linear infinite; }
  @keyframes mq { to { transform:translateX(-100%); } }
  .choices button.sel { background:#ffe36b; color:#2a1a14; }
  @media (hover:hover) and (pointer:fine) { #touch { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="320" height="192"></canvas>
  <div id="hud"></div>
  <div id="caption"></div>
  <div id="center"></div>
  <button id="skip">GEÇ ▸</button>
</div>
<div id="touch">
  <div><button id="bL">◀</button><button id="bR">▶</button></div>
  <div><button id="bD">▼</button><button id="bF">✦</button><button id="bJ">▲</button></div>
</div>
<p class="help">◀ ▶ / A D: yürü &nbsp;·&nbsp; ▲ / BOŞLUK / W: zıpla &nbsp;·&nbsp; F / X: ateş &nbsp;·&nbsp; uzayda ▲▼◀▶ ile uç &nbsp;·&nbsp; Uzaylıların üstüne zıplayarak onları ezebilirsin</p>

"..KHHHHHHHHHHK..",".KHHHHHHHHHHHHK.",".KHHSSHSSSHSSHK.",".KHSSSSSSSSSSHK.",".KSDDDSSSSDDDSK.",

["..KQQQQKKQQQQK..",".KQQQK....KQQQK.","KQQQK......KQQQK","KBBBBK....KBBBBK"],

];
const TABBY_TOP = [

".KAKKKKKKKCCCCK.",".KKAaAaAaAAAAK..","..KAaAaAaAAAAK..","..KACCCCCCCCAK..",
];

const TUX_TOP = [

// arched-back (hissing) cats
const TABBY_ARCH = [

];
const TUX_ARCH = [
"....KKKKK.K...K.","K.KKXXXXXKXK.KXK","KXKXXXXXXKXXZXXK","KXKXXXXXXKXYZXYK","KXKXXXXXXKXZZNZK",
".KKXZZZZZRZZZZK.","..KXKXK..KZKZK..","..KXKXK..KZKZK..","..KXKXK..KZKZK..","..KXKXK..KZKZK..",
"..KZKZK..KZKZK..","..KKKKK..KKKKK..",
];
// cats held in arms
const TABBY_HELD = [
".......K..K.","......KAKKAK",".KKKKKKAaAaK","KAaAaAKVAAVK","KAaAaAKAANAK","KCCCCCCKCCK.",".KKKKKKKKK..",
];
const TUX_HELD = [
".......K..K.","......KXKKXK",".KKKKKKXZXXK","KXXXXXKYZXYK","KXXXXXKZZNZK","KZZZZZZRZZK.",".KKKKKKKKK..",
];
const ALIEN = [[
".......K........","......KUK.......",".......K........",".....KKKKKK.....","...KKggggggKK...",
"..KggggggggggK..",".KggKKKggKKKggK.",".KgKKZKggKZKKgK.",".KgKKKKggKKKKgK.","..KggKggggKggK..",
"...KgggKKgggK...","....KKggggKK....","...KggKggKggK...","..KgK.KggK.KgK..","..KK..KggK..KK..",
".....KK..KK.....",
],[
".......K........","......KUK.......",".......K........",".....KKKKKK.....","...KKggggggKK...",
"..KggggggggggK..",".KggKKKggKKKggK.",".KgKKZKggKZKKgK.",".KgKKKKggKKKKgK.","..KggKggggKggK..",
"...KgggKKgggK...","....KKggggKK....","..KgK.KggK.KgK..",".KgK..KggK..KgK.",".KK...KggK...KK.",
"......KK.KK.....",
]];
const ALIEN_SQUASH = [
"................","................","................","................","................",
"................","................","................","................","................",
"................","...KKKKKKKKKK...","..KggKKggKKggK..",".KgggggggggggggK",".KKKKKKKKKKKKKKK",
"................",
];
const UFO = [
"........KKKKKK..........","......KKLLLLLLKK........",".....KLLLLggLLLLK.......",".....KLLLggggLLLK.......",
"..KKKKKKKKKKKKKKKKKK....",".KOOOOOOOOOOOOOOOOOOK...","KOUOOUOOUOOUOOUOOUOOK...",".KooooooooooooooooooK...",
"..KKKKKKKKKKKKKKKKKK....",
];
const CAN = [".KKKKKK.","KOOOOOOK","KRRRRRRK","KRZZZRRK","KRRZZZRK","KRRRRRRK","KooooooK",".KKKKKK."];

const SPR = {
  olcum:[...OLCUM_LEGS.map(l=>OLCUM_TOP.concat(l))],
  alihan:[...ALIHAN_LEGS.map(l=>ALIHAN_TOP.concat(l))],
  hurma:[...TABBY_LEGS.map(l=>TABBY_TOP.concat(l))],
  azus:[...TUX_LEGS.map(l=>TUX_TOP.concat(l))],
};
const ARCH = { hurma:TABBY_ARCH, azus:TUX_ARCH };
const HELD = { hurma:TABBY_HELD, azus:TUX_HELD };

// =====================================================================
//  CORE
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 320, H = 192;
const $ = id => document.getElementById(id);
const capEl=$('caption'), centerEl=$('center'), hudEl=$('hud'), skipEl=$('skip');

function draw(frame, x, y, flip=false, s=1, sy=s){
  x=Math.round(x); y=Math.round(y);
  const w=frame[0].length;
  for(let j=0;j<frame.length;j++){
    const row=frame[j];
    for(let i=0;i<w;i++){
      const ch=row[i]; if(ch==='.'||ch===undefined) continue;
      ctx.fillStyle=PAL[ch]||'#f0f';
      const px=flip?(w-1-i):i;
      ctx.fillRect(x+px*s, y+Math.floor(j*sy), s, Math.ceil(sy));
    }
  }
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k, ease=k=>{k=clamp(k,0,1);return k*k*(3-2*k);};
function hexLerp(a,b,k){ const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return 'rgb('+pa.map((v,i)=>Math.round(lerp(v,pb[i],k))).join(',')+')'; }
function rng(seed){ let x=seed>>>0||1; return ()=>{ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return x/4294967296; }; }
function hsh(a,b){ let h=(a*374761393 + b*668265263)>>>0; h=(h^(h>>>13))*1274126177>>>0; return (h^(h>>>16))>>>0; }

// draw a person by feet-center position; optionally holding a cat
function drawPerson(id, fx, fy, frameIdx, flip, held){
  const fr=SPR[id][frameIdx], h=fr.length, x=fx-8, y=fy-h;
  draw(fr, x, y, flip);
  if(held){
    const hy = y + (id==='olcum'?15:16);
    draw(HELD[held], x+2, hy, flip);
    ctx.fillStyle=PAL.S; // hands
    ctx.fillRect(x+(flip?12:2), hy+5, 2, 2); ctx.fillRect(x+(flip?2:12), hy+5, 2, 2);
  }
}
function drawCat(id, fx, fy, frameIdx, flip, arched){
  const fr = arched ? ARCH[id] : SPR[id][frameIdx];
  draw(fr, fx-8, fy-fr.length, flip);
}

// =====================================================================
//  INPUT
// =====================================================================
const keys={left:false,right:false,jump:false}; let jumpQueued=0, actionQueued=false;
const KM={ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyF:'fire',KeyX:'fire',KeyJ:'fire'};
let fireQueued=false, actionNow=false; const keyEdge={left:false,right:false};
addEventListener('keydown',e=>{
  const k=KM[e.code]; if(k){ e.preventDefault(); if((k==='left'||k==='right')&&!keys[k]) keyEdge[k]=true; if(k==='jump'&&!keys.jump) jumpQueued=0.12; if(k==='fire'&&!e.repeat) fireQueued=true; keys[k]=true; }
  if(e.code==='Enter'&&state==='intro'){ goLevelCard(0); } else if(e.code==='Enter'&&state==='story'){ goLevelCard(2); }
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!e.repeat) actionQueued=true; }
});
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) keys[k]=false; });
function bindBtn(id,k){ const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault(); if(k==='jump'){jumpQueued=0.12; actionQueued=true;} if(k==='fire') fireQueued=true; keys[k]=true;});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false)); }
bindBtn('bL','left'); bindBtn('bR','right'); bindBtn('bJ','jump'); bindBtn('bF','fire'); bindBtn('bD','down');
$('wrap').addEventListener('pointerdown',e=>{ if(e.target!==skipEl) actionQueued=true; });
skipEl.addEventListener('click',e=>{ e.stopPropagation(); if(state==='intro') goLevelCard(0); else if(state==='story') goLevelCard(2); });

// =====================================================================
//  BACKGROUND (post-apocalyptic, varied)
// =====================================================================
function makeSkyline(seed, minH, maxH, total){
  const r=rng(seed), out=[]; let x=0;
  while(x<total){
    const w=8*(2+Math.floor(r()*4)), h=minH+Math.floor(r()*(maxH-minH));
    const cuts=[]; for(let i=0;i<w;i+=4) cuts.push(Math.floor(r()*(r()<0.5?14:4)));
    const wins=[]; for(let wy=8;wy<h-6;wy+=8) for(let wx=3;wx<w-4;wx+=6) if(r()<0.1) wins.push([wx,wy,r()<0.35]);
    out.push({x,w,h,cuts,wins,rebar:r()<0.4,light:r()<0.4,phase:r()*2,hole:r()<0.25?[4+Math.floor(r()*(w-12)),10+Math.floor(r()*Math.max(1,h-24))]:null});
    x+=w+(r()<0.3?8+Math.floor(r()*16):0);
  }
  return out;
}
const FAR=makeSkyline(7,34,90,1400), NEAR=makeSkyline(42,20,64,2200);
const SMOKES=(()=>{const r=rng(99),o=[];for(let x=0;x<1600;x+=90+r()*140)o.push({x,y:4+r()*50,s:r()<0.5?2:3});return o;})();
const LAMPS=(()=>{const r=rng(5),o=[];for(let x=40;x<2200;x+=120+r()*200)o.push({x,tilt:r()<0.5});return o;})();

function drawSkyline(list, off, base, col, t, lights){
  for(const b of list){
    const bx=Math.round(b.x-off); if(bx>W||bx+b.w<0) continue;
    ctx.fillStyle=col;
    b.cuts.forEach((c,i)=>ctx.fillRect(bx+i*4, base-b.h+c, 4, b.h-c));
    if(b.rebar){ ctx.fillRect(bx+2, base-b.h-8, 1, 10); ctx.fillRect(bx+6, base-b.h-5, 1, 7); }
    if(b.hole){ ctx.fillStyle='rgba(224,138,82,0.55)'; ctx.fillRect(bx+b.hole[0], base-b.h+b.hole[1], 6, 5); }
    if(lights){
      b.wins.forEach(([wx,wy,red])=>{
        if(red){ const on=Math.sin(t*3+wx+wy)>-0.2; ctx.fillStyle=on?'rgba(255,50,50,0.9)':'rgba(120,20,20,0.6)'; }
        else ctx.fillStyle='rgba(255,170,90,0.7)';
        ctx.fillRect(bx+wx, base-b.h+wy+6, 2, 3);
      });
      if(b.light && ((t+b.phase)%1.6)<0.8){
        const lx=bx+Math.floor(b.w/2), ly=base-b.h+b.cuts[Math.floor(b.cuts.length/2)]-3;
        ctx.fillStyle='rgba(255,40,40,0.25)'; ctx.fillRect(lx-3,ly-3,8,8);
        ctx.fillStyle='#ff3030'; ctx.fillRect(lx,ly,2,2);
      }
    }
  }
}
function drawSky(){
  const bands=['#2b1b33','#3d2340','#57304a','#7a3d4c','#a3514b','#c96a4a','#e08a52'];
  const bh=Math.ceil(165/bands.length);
  bands.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(0,i*bh,W,bh); });
  ctx.fillStyle='rgba(255,170,110,0.35)'; ctx.fillRect(232,34,44,40); ctx.fillRect(226,40,56,28);
  ctx.fillStyle='#ffb27a'; ctx.fillRect(240,42,28,24); ctx.fillRect(236,46,36,16);
}
function smoke(x,y,s){
  ctx.fillStyle='rgba(50,36,46,0.55)';
  [[2,2,12,4],[0,4,18,4],[4,0,8,2],[6,8,8,2]].forEach(([a,b,w,h])=>ctx.fillRect(x+a*s,y+b*s,w*s,h*s));
}
// flying UFOs in the sky
let bgUfos=[], bgUfoTimer=2;
function updateBgUfos(dt){
  bgUfoTimer-=dt;
  if(bgUfoTimer<=0){ bgUfoTimer=4+Math.random()*6; const dir=Math.random()<0.5?1:-1;
    bgUfos.push({x:dir>0?-30:W+30, y:8+Math.random()*55, vx:dir*(25+Math.random()*45), bob:Math.random()*6, s:Math.random()<0.3?2:1}); }
  bgUfos.forEach(u=>u.x+=u.vx*dt); bgUfos=bgUfos.filter(u=>u.x>-60&&u.x<W+60);
}
function drawBgUfos(t){
  bgUfos.forEach(u=>{
    const y=u.y+Math.sin(t*2+u.bob)*2;
    if(u.s===1){ // tiny distant UFO silhouette with blinking lights
      ctx.fillStyle='#1d1420'; ctx.fillRect(u.x+3,y,6,2); ctx.fillRect(u.x,y+2,12,2);
      ctx.fillStyle=((t*4|0)%2)?'#ff4040':'#7fe07a'; ctx.fillRect(u.x+2,y+3,1,1); ctx.fillRect(u.x+9,y+3,1,1);
    } else draw(UFO,u.x,y,u.vx<0);
  });
}
function drawLamp(x,base,tilt){
  ctx.fillStyle='#1c1418';
  if(tilt){ for(let i=0;i<40;i++) ctx.fillRect(x+Math.floor(i/5),base-i,2,1); ctx.fillRect(x+8,base-42,6,2); }
  else { ctx.fillRect(x,base-46,3,46); for(let i=0;i<5;i++) ctx.fillRect(x+3+i*2,base-46-i,2,2); ctx.fillRect(x+12,base-50,4,3); }
}
function drawBackground(cam,t){
  drawSky();
  const base=160;
  drawSkyline(FAR, cam*0.15, base, '#4a2f45', t, true);
  drawBgUfos(t);
  SMOKES.forEach(s=>{ const x=s.x-cam*0.25 - t*3; const xx=((x%1600)+1600)%1600-60; if(xx<W+20) smoke(xx,s.y,s.s); });
  drawSkyline(NEAR, cam*0.4, base, '#2a1d28', t, false);
  // red signal lights on some near ruins
  NEAR.forEach((b,i)=>{ if(i%5!==2) return; const bx=Math.round(b.x-cam*0.4); if(bx<-10||bx>W) return;
    if(((t*1.3+i)%1.2)<0.5){ ctx.fillStyle='rgba(255,30,30,0.3)'; ctx.fillRect(bx+2,base-b.h+b.cuts[0]-4,7,7); ctx.fillStyle='#ff2a2a'; ctx.fillRect(bx+4,base-b.h+b.cuts[0]-2,3,3);} });
  LAMPS.forEach(l=>{ const x=Math.round(l.x-cam*0.4); if(x>-20&&x<W+20) drawLamp(x,base,l.tilt); });
}
// ash

  buildLevel(); spawnEntities();

  const sx = checkpoint*TS;
  leader={x:sx, y:160-LH, vx:0, vy:0, onGround:true, flip:false, coyote:0};
  trail=[]; for(let d=80; d>=0; d-=2) trail.push({x:sx+LW/2-d, y:160});
  mem=MEMBERS.map(m=>({...m, x:sx-m.sp, y:160, flip:false, odo:0, moving:false}));
  aliens.forEach(al=>{ if(Math.abs(al.x-sx)<120) al.alive=false; });
  cam=clamp(leader.x-130,0,COLS*TS-W);

function bbox(m){ return m.cat ? {x:m.x-5,y:m.y-8,w:10,h:8} : {x:m.x-4,y:m.y-22,w:8,h:22}; }
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const trailAt=sp=>trail[Math.max(0,trail.length-1-Math.round(sp/2))];

function hitBlock(r,c){
  const key=r+','+c;
  grid[r][c]='U';
  if(LEVELS[LV].guns.includes(key)){
    const g=LEVELS[LV].gunAmmo||5; ammo+=g; pops.push({x:c*TS+4,y:r*TS-8,t:0,kind:'gun'}); floaters.push({x:c*TS-6,y:r*TS-14,txt:'+'+g+' MERMİ',t:0});
  } else { pops.push({x:c*TS+4,y:r*TS-8,t:0,kind:'can'}); score++; }
}
function updateLeader(dt){
  const L=leader;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  L.vx=dir*SPEED; if(dir) L.flip=dir<0;
  if(jumpQueued>0 && (L.onGround||L.coyote>0)){ L.vy=JUMPV; L.onGround=false; L.coyote=0; jumpQueued=0; }
  if(!keys.jump && L.vy<-120) L.vy=-120;
  L.vy=Math.min(L.vy+GRAV*dt, 420);
  L.x+=L.vx*dt;
  if(L.x<0) L.x=0;
  for(const yy of [L.y+1, L.y+LH/2, L.y+LH-1]){
    if(L.vx>0 && solidAt(L.x+LW,yy)) L.x=Math.floor((L.x+LW)/TS)*TS-LW-0.01;
    if(L.vx<0 && solidAt(L.x,yy)) L.x=Math.floor(L.x/TS)*TS+TS+0.01;
  }
  const wasGround=L.onGround; L.onGround=false;
  L.y+=L.vy*dt;
  if(L.vy>=0){
    if(solidAt(L.x+1,L.y+LH)||solidAt(L.x+LW-1,L.y+LH)){ L.y=Math.floor((L.y+LH)/TS)*TS-LH; L.vy=0; L.onGround=true;
      if(tileAt(L.x+1,L.y+LH+1)==='M'||tileAt(L.x+LW-1,L.y+LH+1)==='M'){ L.vy=-470; L.onGround=false; bounceT=0.25; } }
  } else {
    for(const xx of [L.x+2, L.x+LW-2]){
      if(solidAt(xx,L.y)){
        const c=Math.floor(xx/TS), r=Math.floor(L.y/TS);
        L.y=(r+1)*TS; L.vy=0;
        if(grid[r]&&grid[r][c]==='P') hitBlock(r,c);
        break;
      }
    }
  }
  if(L.onGround) L.coyote=0.09; else if(wasGround) L.coyote=0.09; else L.coyote=Math.max(0,L.coyote-dt);
  const fx=L.x+LW/2, fy=L.y+LH;
  let last=trail[trail.length-1], d=Math.hypot(fx-last.x,fy-last.y);
  while(d>=2){ const k=2/d; last={x:last.x+(fx-last.x)*k, y:last.y+(fy-last.y)*k}; trail.push(last); d=Math.hypot(fx-last.x,fy-last.y); }
  if(trail.length>700) trail.splice(0,trail.length-700);
  mem.forEach((m,i)=>{
    let nx,ny;
    if(i===0){ nx=fx; ny=fy; } else { const p=trailAt(m.sp); nx=p.x; ny=p.y; }
    const dx=nx-m.x; m.moving=Math.abs(dx)>0.05||Math.abs(ny-m.y)>0.05;
    if(Math.abs(dx)>0.05) m.flip=dx<0;
    m.odo+=Math.hypot(dx,ny-m.y); m.x=nx; m.y=ny;
  });
  mem[0].flip=L.flip; mem[0].air=!L.onGround;
}
function memberFrame(m){
  if(m.cat) return m.moving ? 1-(Math.floor(m.odo/8)%2) : 0;
  if(m.air) return 1;

}
function updateBullets(dt){
  fireCd-=dt;

    if(ammo>0 && fireCd<=0){ ammo--; fireCd=0.22; const dir=leader.flip?-1:1;
      bullets.push({x:leader.x+(dir>0?LW+6:-10), y:leader.y+19, vx:dir*240, t:0}); }
    else if(ammo<=0) floaters.push({x:leader.x-6,y:leader.y-8,txt:'MERMİ YOK',t:0.5});
  }
  for(const b of bullets){
    b.x+=b.vx*dt; b.t+=dt;
    if(solidAt(b.x+2,b.y)||b.t>1.2){ b.dead=true; continue; }
    for(const a of aliens){
      const S=a.big?24:16;
      if(a.alive && overlap({x:b.x,y:b.y-1,w:5,h:3},{x:a.x+2,y:a.y+3,w:S-4,h:S-3})){ b.dead=true; hurtAlien(a,'shot'); break; }

}
function hurtAlien(a,how){
  a.hp--;
  if(a.hp<=0){ a.alive=false; if(how==='stomp') a.squash=0.5; else { a.zap=0.4; floaters.push({x:a.x-2,y:a.y-4,txt:'ZAP!',t:0}); } }
  else { a.hurt=0.7; a.stun=Math.max(a.stun,1.6); floaters.push({x:a.x+2,y:a.y-6,txt:'GRR!',t:0}); }
}
function updateAliens(dt){
  for(const a of aliens){
    const S=a.big?24:16;
    if(!a.alive){ a.squash-=dt; a.zap-=dt; continue; }
    if(!a.active){ if(a.x<cam+W+40) a.active=true; else continue; }
    if(a.hurt>0) a.hurt-=dt;
    a.vy=Math.min(a.vy+GRAV*dt,400);
    if(!leader.onGround && leader.x+LW>a.x && leader.x<a.x+S && leader.y+LH<a.y+4 && a.stun<=0){ a.stun=2.2; }
    if(a.stun>0) a.stun-=dt; else a.x+=a.vx*dt;
    const front = a.vx<0 ? a.x+4 : a.x+S-4;
    if(a.stun>0){}
    else if(solidAt(front,a.y+S/2) || (a.y>110 && solidAt(front,a.y-20))) { a.vx=-a.vx; a.x+=a.vx*dt*2; }
    else if(!solidAt(front,a.y+S+1) && solidAt(a.x+S/2,a.y+S+1)) a.vx=-a.vx;
    a.y+=a.vy*dt;
    if(solidAt(a.x+S/2,a.y+S)){ a.y=Math.floor((a.y+S)/TS)*TS-S; a.vy=0; }
    if(a.y>H+40) a.alive=false;
    const ab={x:a.x+2,y:a.y+3,w:S-4,h:S-3};
    const lb={x:leader.x,y:leader.y,w:LW,h:LH};
    if(overlap(ab,lb) && leader.vy>0 && leader.y+LH <= a.y+11){ leader.vy=a.big?-280:-220; hurtAlien(a,'stomp'); continue; }
    if(a.hurt>0.35) continue;
    for(let i=0;i<mem.length;i++){ const m=mem[i]; if(i>0 && a.stun>0) continue;
      if(overlap(ab,bbox(m))){ die('Uzaylılar '+suffix(m.name)+' yakaladı!'); return; } }
  }
}
function updateCaptive(dt){
  const c=captive; if(!c) return;

}

    const S=a.big?24:16;
    if(a.alive){ if(a.active||a.x<cam+W+40){
      if(!(a.hurt>0 && (t*20|0)%2)) draw((a.big?BIG:ALIEN)[a.stun>0?0:(t*4|0)%2],a.x,a.y,a.vx>0);

    else if(a.squash>0) draw(ALIEN_SQUASH,a.x+(S-16)/2,a.y+S-16);
    else if(a.zap>0){ const k=1-a.zap/0.4; ctx.fillStyle=((t*20|0)%2)?'#ffe36b':'#7fe07a';
      for(let i=0;i<8;i++){ const an=i*Math.PI/4; ctx.fillRect(a.x+S/2+Math.cos(an)*k*14, a.y+S/2+Math.sin(an)*k*14, 2, 2); } }
  });
  // captive
  if(captive){
    const c=captive, sh=(c.cornered&&c.state!=='caught')?Math.round(Math.sin(t*50)):0;
    if(c.state==='caught'){ const az=mem[3]; ctx.fillStyle='#b08a52';
      const x0=az.x, y0=az.y-6, x1=c.x+8, y1=c.y+10, n=Math.max(1,Math.abs(x1-x0)|0);
      for(let i=0;i<=n;i+=2){ const k=i/n; ctx.fillRect(x0+(x1-x0)*k, y0+(y1-y0)*k+Math.sin(k*Math.PI)*3, 1, 1); } }
    draw(CAPTIVE[c.state==='flee'&&!c.cornered?((t*8|0)%2):0], c.x+sh, c.y, c.state==='caught'?c.flip:false);
    if(c.state!=='caught' && ((t*3|0)%2)){ ctx.fillStyle='#8fd0ff'; ctx.fillRect(c.x+14,c.y+4,2,3); }
  }
  // party
  for(let i=mem.length-1;i>=0;i--){
    const m=mem[i], f=memberFrame(m);
    if(m.cat) drawCat(m.id,m.x,m.y,f,m.flip,false);
    else { drawPerson(m.id,m.x,m.y,f,m.flip,null);
      if(i===0 && ammo>0) draw(GUN, m.flip ? m.x-8-5 : m.x-8+13, m.y-LH+18, m.flip); }
  }
  // bullets
  bullets.forEach(b=>{ ctx.fillStyle='rgba(255,227,107,0.4)'; ctx.fillRect(b.x-1,b.y-2,7,5); ctx.fillStyle='#fff6b0'; ctx.fillRect(b.x,b.y-1,5,2); });
  // chasing UFO
  if(L.chaser){
    const uy=18+Math.sin(t*2)*3;
    ctx.fillStyle=`rgba(160,255,140,${0.22+0.06*Math.sin(t*12)})`;
    ctx.beginPath(); ctx.moveTo(ufo.x+16,uy+18); ctx.lineTo(ufo.x+32,uy+18); ctx.lineTo(ufo.x+44,160); ctx.lineTo(ufo.x+4,160); ctx.fill();
    draw(UFO,ufo.x,uy,false,2);
    ctx.fillStyle=((t*6|0)%2)?'#ff3030':'#ffe36b'; ctx.fillRect(ufo.x+4,uy+12,2,2); ctx.fillRect(ufo.x+38,uy+12,2,2);
  }
  // floating texts
  ctx.font='8px "Press Start 2P", monospace'; ctx.textBaseline='top';

  floaters=floaters.filter(f=>f.t<1.1);
  ctx.restore();
  if(L.theme==='city') drawAsh(dt,t); else if(planet) drawSpores(dt,t);
}

function updatePlay(dt){
  const L=LEVELS[LV];
  levelT+=dt;
  updateLeader(dt);
  cam=lerp(cam, clamp(leader.x-130,0,COLS*TS-W), 0.15);
  updateBullets(dt);
  updateAliens(dt);
  if(state!=='play') return;
  updateCaptive(dt);
  cans.forEach(cn=>{ if(cn.got) return; const b={x:cn.x,y:cn.y,w:8,h:8}; if(mem.some(m=>overlap(b,bbox(m)))){ cn.got=true; score++; } });
  if(L.chaser){
    if(levelT>4) ufo.x=Math.max(ufo.x+8*dt, cam-50);
    for(const m of mem){ if(m.x>ufo.x+8 && m.x<ufo.x+40){ die(suffix(m.name)+' UFO çekip aldı!'); return; } }
  }
  for(const l of lasers){
    if(laserPhase(l)<1.0){ const lb={x:l.c*TS+5,y:22,w:6,h:132};
      for(const m of mem){ if(overlap(lb,bbox(m))){ die('Lazer '+(m.name==='Olçum'?"Olçum'a":m.name==='Azuş'?"Azuş'a":m.name+"'a")+' çarptı!'); return; } } }
  }
  if(L.theme==='planet'){ for(const m of mem){ const b=bbox(m);
      for(let r=Math.floor(b.y/TS);r<=Math.floor((b.y+b.h)/TS);r++) for(let c=Math.floor(b.x/TS);c<=Math.floor((b.x+b.w)/TS);c++){
        if(grid[r]&&grid[r][c]==='^'&&overlap(b,{x:c*TS+2,y:r*TS+9,w:12,h:7})){ die(m.name+' kristal dikene bastı!'); return; } } } }
  if(bounceT>0) bounceT-=dt;
  if(leader.y>H+20){ die(L.theme==='ufo'?'Yeşil sıvıya düştünüz!':L.theme==='planet'?'Turuncu sıvıya düştünüz!':'Çukura düştünüz!'); return; }
  for(const cp of L.checkpoints){ if(leader.x>cp*TS && checkpoint<cp && leader.onGround){ checkpoint=cp; savedScore=score; savedAmmo=ammo; floaters.push({x:cp*TS-20,y:110,txt:'KAYIT!',t:0}); } }
  if(L.end && leader.x+LW/2 > L.end*TS+2 && leader.onGround){ if(L.theme==='planet') goThrone(); else goLevelCard(LV+1); return; }
  if(LV===1 && captive && captive.state==='caught' && captive.t>2.2){ goStory(); return; }
  hudEl.innerHTML=`MAMA × ${score}<br>MERMİ × ${ammo}<br>DENEME ${tries+1}`;
}

function updateSpace(dt){
  sp.t+=dt; levelT=sp.t;
  const dx=(keys.right?1:0)-(keys.left?1:0), dy=(keys.down?1:0)-(keys.jump?1:0);
  sp.x=clamp(sp.x+dx*115*dt,4,W-52); sp.y=clamp(sp.y+dy*105*dt,14,H-24);
  sp.cd-=dt;
  if((keys.fire||fireQueued) && sp.cd<=0){ sp.shots.push({x:sp.x+42,y:sp.y+12}); sp.cd=0.2; }
  fireQueued=false;
  const ending=sp.t>SPACE_LEN-9;
  if(!ending){ sp.spawn-=dt; if(sp.spawn<=0){ spawnRock();
      if(Math.random()<0.14) sp.items.push({x:W+8,y:24+Math.random()*(H-60),kind:Math.random()<0.3?'shield':'can'});
      sp.spawn=Math.max(0.5,1.15-sp.t*0.01); } }
  for(const r of sp.rocks){ r.x+=r.vx*dt; r.y+=r.vy*dt; r.rot+=dt*(r.vx<-80?2:1); r.hit-=dt; if(r.y<10||r.y>H-10) r.vy=-r.vy; if(r.x<-30) r.dead=true; }
  for(const s of sp.shots){ s.x+=280*dt; if(s.x>W+10) s.dead=true;
    for(const r of sp.rocks){ if(!r.dead && Math.hypot(s.x-r.x,s.y-r.y)<r.r+2){ s.dead=true; r.hp--; r.hit=0.1;
      if(r.hp<=0){ r.dead=true; for(let i=0;i<8;i++) sp.fx.push({x:r.x,y:r.y,vx:(Math.random()-0.5)*90,vy:(Math.random()-0.5)*90,t:0.5}); }
      break; } } }
  for(const it of sp.items){ it.x-=55*dt;
    if(overlap({x:it.x,y:it.y,w:8,h:8},{x:sp.x+4,y:sp.y+2,w:40,h:16})){ it.dead=true;
      if(it.kind==='can'){ score++; sp.txt.push({x:it.x,y:it.y,s:'+1 MAMA',t:0}); } else { sp.shield=Math.min(3,sp.shield+1); sp.txt.push({x:it.x,y:it.y,s:'+KALKAN',t:0}); } }
    if(it.x<-10) it.dead=true; }
  sp.inv-=dt; sp.shake-=dt;
  const boxes=[{x:sp.x+4,y:sp.y+9,w:40,h:8},{x:sp.x+12,y:sp.y+2,w:20,h:8}];
  for(const r of sp.rocks){ if(r.dead) continue;
    for(const b of boxes){ const nx=clamp(r.x,b.x,b.x+b.w), ny=clamp(r.y,b.y,b.y+b.h);
      if(Math.hypot(r.x-nx,r.y-ny)<r.r-1){
        if(sp.inv<=0){ sp.shield--; sp.inv=1.6; sp.shake=0.3; r.dead=true;
          for(let i=0;i<10;i++) sp.fx.push({x:r.x,y:r.y,vx:(Math.random()-0.5)*110,vy:(Math.random()-0.5)*110,t:0.6});
          if(sp.shield<=0){ die('UFO göktaşına çarptı!'); return; } }
        break; } } }
  for(const f of sp.fx){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.t-=dt; }
  sp.rocks=sp.rocks.filter(r=>!r.dead); sp.shots=sp.shots.filter(s=>!s.dead); sp.items=sp.items.filter(i=>!i.dead); sp.fx=sp.fx.filter(f=>f.t>0);
  if(sp.t>32 && spCheckpoint<32){ spCheckpoint=32; savedScore=score; sp.txt.push({x:W/2-30,y:40,s:'KAYIT!',t:0}); }
  if(sp.t>SPACE_LEN){ goLevelCard(3); return; }
  hudEl.innerHTML=`MAMA × ${score}<br>KALKAN ${'♥'.repeat(Math.max(0,sp.shield))}<br>DENEME ${tries+1}`;
}

function bubbleML(x,y,txt,maxW=196){
  ctx.font='8px "Press Start 2P", monospace'; ctx.textBaseline='top';
  const words=txt.split(' '), lines=[]; let cur='';
  for(const w of words){ const tryL=cur?cur+' '+w:w; if(ctx.measureText(tryL).width>maxW-10 && cur){ lines.push(cur); cur=w; } else cur=tryL; }
  if(cur) lines.push(cur);
  const w=Math.ceil(Math.max(...lines.map(l=>ctx.measureText(l).width)))+10, h=lines.length*11+6;
  const bx=Math.round(clamp(x-w/2,2,W-w-2)), by=Math.round(Math.max(2,y-h-6));
  ctx.fillStyle='#2a1a14'; ctx.fillRect(bx-1,by-1,w+2,h+2);
  ctx.fillStyle='#fff8ec'; ctx.fillRect(bx,by,w,h);
  const tx=clamp(x,bx+4,bx+w-4);
  ctx.fillStyle='#2a1a14'; ctx.fillRect(tx-3,by+h,7,2); ctx.fillRect(tx-2,by+h+2,5,2); ctx.fillRect(tx-1,by+h+4,3,2);
  ctx.fillStyle='#fff8ec'; ctx.fillRect(tx-2,by+h-1,5,2); ctx.fillRect(tx-1,by+h+1,3,2); ctx.fillRect(tx,by+h+3,1,2);
  ctx.fillStyle='#2a1a14'; lines.forEach((l,i)=>ctx.fillText(l,bx+5,by+4+i*11));
}

let duel=null;
const DUEL_FLOOR=182;
function goDuel(who){
  state='duel'; stateT=0; hudEl.style.display='none';
  duel={who, other:who==='alihan'?'olcum':'alihan', phase:'intro', pt:0,
    pl:{x:80,y:DUEL_FLOOR,vy:0,onGround:true,hp:100,energy:100,face:1,cd:0,hit:0,odo:0,moving:false,shield:false},
    op:{x:250,y:DUEL_FLOOR,vy:0,onGround:true,hp:100,face:-1,cd:1.6,burst:2,dir:0,think:0.5,hit:0,odo:0},
    pb:[], ob:[], fx:[], cageY:20, cageVy:0, winner:null, shake:0};
  setCenter(`<h1>${who==='alihan'?'ALİHAN':'OLÇUM'}<br>vs<br>ZORG</h1>`, false);
}
function duelFire(f, isPl){
  const y=f.y-(isPl?18:20);
  (isPl?duel.pb:duel.ob).push({x:f.x+f.face*(isPl?20:28), y, vx:f.face*(isPl?250:175)});
}
function updateDuel(dt){
  const D=duel, p=D.pl, o=D.op;
  D.pt+=dt; D.shake-=dt;
  if(D.phase==='intro'){
    if(D.pt>1.3 && D.pt<1.35) setCenter('<h1>DÖVÜŞ!</h1>');
    if(D.pt>2.1){ D.phase='fight'; D.pt=0; setCenter(''); }
    return;
  }
  if(D.phase==='fight'){
    // player
    p.face = o.x>p.x?1:-1;
    p.shield = keys.down && p.energy>4 && p.onGround;
    if(p.shield) p.energy=Math.max(0,p.energy-38*dt); else p.energy=Math.min(100,p.energy+20*dt);
    const dir=p.shield?0:(keys.right?1:0)-(keys.left?1:0);
    const nx=clamp(p.x+dir*95*dt,16,304);
    if(Math.abs(nx-o.x)>34 || Math.abs(nx-o.x)>Math.abs(p.x-o.x)) p.x=nx;
    p.moving=dir!==0; p.odo+=Math.abs(dir*95*dt);
    if(jumpQueued>0 && p.onGround && !p.shield){ p.vy=-340; p.onGround=false; jumpQueued=0; }
    p.cd-=dt;
    if((fireQueued||keys.fire) && p.cd<=0 && !p.shield){ duelFire(p,true); p.cd=0.28; }
    fireQueued=false;
    // opponent AI
    o.face = p.x>o.x?1:-1;
    o.think-=dt;
    if(o.think<=0){ o.think=0.5+Math.random()*0.8; const dist=Math.abs(p.x-o.x);
      o.dir = dist<100 ? -o.face : dist>200 ? o.face : [0,1,-1][Math.random()*3|0]; }
    const ox=clamp(o.x+o.dir*55*dt,24,296); if(Math.abs(ox-p.x)>34) { o.x=ox; o.odo+=Math.abs(o.dir*55*dt); }
    if(o.onGround && D.pb.some(b=>Math.sign(o.x-b.x)===Math.sign(b.vx) && Math.abs(o.x-b.x)<70) && Math.random()<dt*2.2){ o.vy=-330; o.onGround=false; }
    o.cd-=dt;
    if(o.cd<=0){ duelFire(o,false); o.burst--; if(o.burst>0) o.cd=0.3; else { o.burst=1+(Math.random()*3|0); o.cd=1.1+Math.random()*0.9; } }
  }
  // physics
  for(const f of [p,o]){ if(!f.onGround){ f.vy+=760*dt; f.y+=f.vy*dt; if(f.y>=DUEL_FLOOR){ f.y=DUEL_FLOOR; f.vy=0; f.onGround=true; } } f.hit-=dt; }
  // bullets
  const pBox={x:p.x-9,y:p.y-46,w:18,h:46}, oBox={x:o.x-17,y:o.y-44,w:34,h:44};
  for(const b of D.pb){ b.x+=b.vx*dt; if(b.x<-10||b.x>W+10) b.dead=true;
    if(D.phase==='fight' && overlap({x:b.x-3,y:b.y-1,w:6,h:3},oBox)){ b.dead=true; o.hp=Math.max(0,o.hp-7); o.hit=0.15; spark(b.x,b.y,'#ffe36b'); } }
  for(const b of D.ob){ b.x+=b.vx*dt; if(b.x<-10||b.x>W+10) b.dead=true;
    if(D.phase!=='fight') continue;
    if(p.shield && Math.sign(b.vx)===-p.face && Math.abs(b.x-(p.x+p.face*14))<6 && b.y>p.y-50){ b.dead=true; spark(b.x,b.y,'#8fd0ff'); continue; }
    if(overlap({x:b.x-3,y:b.y-2,w:6,h:4},pBox)){ b.dead=true; p.hp=Math.max(0,p.hp-8); p.hit=0.2; D.shake=0.15; spark(b.x,b.y,'#7fff8a'); } }
  D.pb=D.pb.filter(b=>!b.dead); D.ob=D.ob.filter(b=>!b.dead);
  for(const f of D.fx){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=200*dt; f.t-=dt; } D.fx=D.fx.filter(f=>f.t>0);
  if(D.phase==='fight' && (o.hp<=0||p.hp<=0)){ D.phase='ko'; D.pt=0; D.winner=o.hp<=0?'pl':'op'; setCenter('<h1>K.O.!</h1>'); }
  if(D.phase==='ko' && D.pt>1.6){ D.phase='outro'; D.pt=0; setCenter(''); }
  if(D.phase==='outro'){
    if(D.winner==='op'){ // cage drops into the cauldron
      if(D.pt>0.6){ D.cageVy+=500*dt; D.cageY+=D.cageVy*dt; }
      if(D.cageY>80 && !D.splashed){ D.splashed=true; D.shake=0.5; for(let i=0;i<30;i++) D.fx.push({x:44+(Math.random()-0.5)*30,y:104,vx:(Math.random()-0.5)*120,vy:-60-Math.random()*120,t:0.9,c:'#3aff6a'}); }
      if(D.pt>2.8){ D.phase='over'; D.pt=0;
        setCenter(`<h1>KAYBETTİN...</h1><div class="sub">${D.other==='alihan'?'Alihan':'Olçum'} kazana düştü.</div><div class="blink">TEKRAR DENE: BOŞLUK</div>`, true); }
    } else { // happy ending
      if(D.pt>0.6){ goEnding(); return; }
      if(D.pt>3.2){ D.phase='over'; D.pt=0;
        setCenter(`<h1>DÜELLOYU<br>KAZANDIN!</h1><div class="sub">${D.other==='alihan'?'Alihan':'Olçum'} kurtuldu. Kral ve kraliçe sözlerini tutacak mı?</div><div class="sub">Devamı yakında...</div><div class="blink">BAŞA DÖN: BOŞLUK</div>`, true); }
    }
  }
  if(D.phase==='over' && actionNow && D.pt>0.8){ if(D.winner==='op') goDuel(D.who); else goTitle(); }
}

    const k=clamp((T-E.catsT)/1.4,0,1), f=k<1?((T*8)|0)%2:0;
    draw(SPR.azus[f], lerp(-40,46,k)-16, DUEL_FLOOR-24, false, 2);
    draw(SPR.hurma[f], lerp(-70,14,k)-16, DUEL_FLOOR-24, false, 2);
    if(T-E.catsT>1.6 && T-E.catsT<2.8) bubbleML(46,DUEL_FLOOR-26,'Miyav!');
    if(T-E.catsT>3.4){ const a=clamp((T-E.catsT-3.4)/0.8,0,1); ctx.fillStyle=`rgba(0,0,0,${a})`; ctx.fillRect(0,0,W,H);
      if(a>=1){ E.scene='B'; E.t=0; } }
  }
  if(T<0.5){ ctx.fillStyle=`rgba(255,255,255,${0.5-T})`; ctx.fillRect(0,0,W,H); }
}

function endSceneB(dt){
  const T=ending.t;
  ctx.fillStyle='#07040f'; ctx.fillRect(0,0,W,H);
  STARS.forEach(s=>{ s.x-=s.z*30*dt; if(s.x<0){s.x=W;s.y=Math.random()*H;} ctx.fillStyle=s.z===3?'#fff':'#999'; ctx.fillRect(s.x|0,s.y|0,1,1); });
  drawPurplePlanet(40-T*18, 100, Math.max(8,70-T*12));
  const ex=W+70-T*36, er=18+T*16;
  pcirc(ex,96,er+2,'#1a2a4a'); pcirc(ex,96,er,'#3a7ad0'); pcirc(ex-er*0.3,96-er*0.3,er*0.3,'#5aaa5a'); pcirc(ex+er*0.25,96+er*0.35,er*0.22,'#5aaa5a');
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillRect(ex-er*0.6,96-er*0.7,er*0.5,2);
  drawPlayerUfo(lerp(30,150,T/5.5), 84+Math.sin(T*3)*4);
  if(T<0.8){ ctx.fillStyle=`rgba(0,0,0,${1-T/0.8})`; ctx.fillRect(0,0,W,H); }
  if(T>4.8){ ctx.fillStyle=`rgba(0,0,0,${clamp((T-4.8)/0.8,0,1)})`; ctx.fillRect(0,0,W,H); }
  if(T>5.7){ ending.scene='C'; ending.t=0; }
}

function endSceneC(dt){
  const E=ending, T=E.t, D=duel;
  roomK = T<6.5 ? 1 : 1-ease((T-6.5)/5);
  drawRoom(20);
  roomK=null;
  // lightsaber on the wall
  const hung=T>4.0;
  if(hung){ ctx.fillStyle='#5b3a28'; ctx.fillRect(156,94,8,2); ctx.fillRect(156,70,8,2); drawSaber(160,96,1,30); }
  drawCouchBack();
  const fighter=D.who, partner=D.other;
  const SEAT={olcum:{sx:140,sitTop:114,h:24},alihan:{sx:176,sitTop:112,h:26}};
  const ppl=[fighter,partner].map(id=>{
    const s=SEAT[id], isF=id===fighter;
    let x, fy=168, frame=0, flip=true;
    if(isF){
      if(T<3.0){ const k=clamp((T-0.6)/2.4,0,1); x=lerp(340,160,k); frame=k<1?[1,0,2,0][Math.floor(T*10)%4]:0; }
      else if(T<4.6) x=160;
      else { const k=clamp((T-4.6)/0.8,0,1); x=lerp(160,s.sx,k); frame=k<1?[1,0,2,0][Math.floor(T*10)%4]:0; flip=s.sx<160; }
    } else {
      const k=clamp((T-0.9)/2.4,0,1); x=lerp(360,s.sx,k); frame=k<1?[1,0,2,0][Math.floor(T*10)%4]:0;
    }
    const sitK=ease((T-5.6)/0.5);
    if(T>5.6){ fy=lerp(168,s.sitTop+s.h,sitK); frame=0; flip = id==='alihan'; x=s.sx; }
    return {id,x,fy,frame,flip,isF,sitting:T>5.6};
  });
  const catPos=[['azus',116,false],['hurma',200,true]].map(([id,cx,fl],i)=>{
    const k=clamp((T-1.2-i*0.3)/2.3,0,1);
    let x=lerp(380+i*30,cx,k), fy=176, frame=k<1?((T*8)|0)%2:0, flip=true;
    if(T>5.8){ const h=clamp((T-5.8)/0.5,0,1); fy=lerp(176,137,h)-Math.sin(h*Math.PI)*16; x=cx; flip=fl; frame=0; }
    return {id,x,fy,frame,flip,onCouch:T>6.2};
  });
  ppl.filter(p=>p.sitting).forEach(p=>drawPerson(p.id,p.x,p.fy,0,p.flip,null));
  catPos.filter(c=>c.onCouch).forEach(c=>drawCat(c.id,c.x,c.fy,0,c.flip));
  drawCouchFront();
  ppl.filter(p=>!p.sitting).forEach(p=>{ drawPerson(p.id,p.x,p.fy,p.frame,p.flip,null);
    if(p.isF && !hung){ if(T<3.4) drawSaber(p.x-6,p.fy-7,1,12);
      else { const k=clamp((T-3.4)/0.6,0,1); drawSaber(lerp(p.x-6,160,k),lerp(p.fy-7,96,k),1,lerp(12,30,k)); } } });
  catPos.filter(c=>!c.onCouch).forEach(c=>drawCat(c.id,c.x,c.fy,c.frame,c.flip));
  // hearts
  if(T>8){ for(let i=0;i<5;i++){ const ht=((T-8)*0.6+i*0.37)%1.6; if(ht<1.2) heart(120+i*22+Math.sin(T*2+i)*3, 108-ht*40); } }
  if(T<0.8){ ctx.fillStyle=`rgba(0,0,0,${1-T/0.8})`; ctx.fillRect(0,0,W,H); }
  if(T>12 && !E.doneT){ E.doneT=T;
    setCenter(`<h1>SON</h1><div class="marquee"><span>...ve sonsuza kadar mutlu yaşadılar ♥</span></div><div class="blink">BAŞA DÖN: BOŞLUK</div>`);
    centerEl.className='dimlight'; }
  if(E.doneT && actionNow && T-E.doneT>1) goTitle();
}
function renderEnding(dt){
  ending.t+=dt;
  if(ending.scene==='A') endSceneA(dt);
  else if(ending.scene==='B') endSceneB(dt);
  else endSceneC(dt);
}

// =====================================================================
//  LOOP
// =====================================================================
let lastTs=performance.now();
function frame(ts){
  let dt=clamp((ts-lastTs)/1000,0,0.033); lastTs=ts; t+=dt; stateT+=dt;
  if(jumpQueued>0) jumpQueued-=dt;
  updateBgUfos(dt);
  const act=actionQueued; actionQueued=false; actionNow=act;

  if(state==='title'){
    if(!grid){ LV=0; buildLevel(); spawnEntities(); }
    const tc=t*14;
    drawBackground(tc,t);
    for(let x=-16;x<W+16;x+=16){ const wx=Math.floor((tc+x)/16); drawTileCity('=',wx,10,x-(tc%16),160); drawTileCity('=',wx,11,x-(tc%16),176); }
    const f=Math.floor(t*8);
    drawCat('azus',112,160,f%2,false); drawCat('hurma',132,160,(f+1)%2,false);
    drawPerson('olcum',156,160,[1,0,2,0][f%4],false); drawPerson('alihan',178,160,[1,0,2,0][(f+2)%4],false);
    drawAsh(dt,t);
    ctx.fillStyle='rgba(10,4,10,0.35)'; ctx.fillRect(0,0,W,H);
    if(act && stateT>0.3) goIntro();
  }
  else if(state==='intro'){ renderIntro(dt); }
  else if(state==='card'){ ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); if(stateT>2.6) goPlay(nextLV); }
  else if(state==='play'){
    if(LEVELS[LV].type==='space'){ updateSpace(dt); if(state==='play'||state==='dead') renderSpace(dt); }
    else { updatePlay(dt); if(state==='play'||state==='dead'||state==='win') renderLevel(dt); } }
  else if(state==='story'){ renderStory(dt); }
  else if(state==='throne'){ renderThrone(dt); }
  else if(state==='talk'){ renderTalk(dt); }
  else if(state==='duel'){ updateDuel(dt); if(state==='duel') renderDuel(dt); }
  else if(state==='ending'){ renderEnding(dt); }
  else if(state==='dead'){
    if(LEVELS[LV].type==='space') renderSpace(0); else renderLevel(0);
    ctx.fillStyle=`rgba(120,10,20,${Math.min(0.45,stateT)})`; ctx.fillRect(0,0,W,H);
    if(stateT<0.05) setCenter(`<h1>YAKALANDINIZ!</h1><div class="sub">${deadMsg}</div><div class="blink">TEKRAR DENE: BOŞLUK</div>`, false);
    if(act && stateT>0.6){ if(LEVELS[LV].type==='space') startSpace(spCheckpoint); else resetRun(); state='play'; stateT=0; setCenter(''); }
  }
  else if(state==='win'){ if(LV===3) renderThrone(dt); else renderLevel(dt); if(act && stateT>1) goTitle(); }
  keyEdge.left=keyEdge.right=false;
  requestAnimationFrame(frame);
}
goTitle();
try{ jumpFromHash(); }catch(e){}
requestAnimationFrame(frame);
</script>
